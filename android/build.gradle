group 'com.whelksoft.flutter_native_timezone'
version '1.0-SNAPSHOT'

// No buildscript block - let main project handle versions

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.whelksoft.flutter_native_timezone'  // Add namespace for AGP 8+
    compileSdk 35  // Updated to SDK 35
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17  // Required for AGP 8+
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'  // Updated for AGP 8+ compatibility
    }
    
    // Enable buildConfig for AGP 8+
    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    
    defaultConfig {
        minSdkVersion 16
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Use hardcoded versions instead of kotlin_version variable
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
}
